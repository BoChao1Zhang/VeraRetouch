# gsample-a-l1b:最后一轮补跑。只挂 lane-1;attempts 3->8(纯重试策略,不进 canonical_request_json.behavior,不改变采样身份)。温度与 gsample-a 相同。
# G1 gsample-a: 10 源 x 2 次独立采样,评估 diag-v3.4 改写后的 global prompt 效果。
# 温度刻意设为 0.1(A=0.1 / B=0.11):LLM 精确缓存按请求哈希(含 behavior.temperature)计算,
# 两跑取不同温度可保证 B 不命中 A 的缓存,成为真正独立的第二次采样。
# 并发压到 2:同机另有全量 annotate 进程占用 relay 双 lane 各 16 并发,不得加压。
[agent_loop]
# B12: same lanes as iter5b, mounting the v2 (histogram) fingerprint table.
campaign_id = "gsample-a-l1b"
prompt_revision = "local-agent-v1"
databuild_config = "../databuild.prod-l8-local400k-20260812.toml"
# 2026-08-21 定档:新中转站 zzone.cc.cd 实测非流式 2 lane x 16 = 32 并发传输 0 失败。
terra_concurrency_target = 2
renderer_concurrency = 3
validator_concurrency = 1
max_global_proposals = 6
max_local_proposals = 3
max_local_repairs = 1
min_committed_leaves = 2
max_committed_leaves = 6
rejected_asset_ttl_days = 30
request_lease_seconds = 180

[checkpoint]
backend = "postgres"
dsn_env = "VERARETOUCH_AGENT_POSTGRES_DSN"
required_tablespace = "agent_loop_local"
minimum_free_bytes = 21474836480

[artifacts]
root = "/mnt/ramstage/agent_loop/gsample-a-l1b"
landing_enabled = false

[catalog]
annotations = "/home/bc/data/scratch/lut_reannotate/out/annotations.closed-v1.jsonl"
# B11 item 1 (R7.1) + B12 item 2: the online local retrieval reads this table and
# the v2 histogram response is mounted from it; graph build asserts it is mounted.
segment_fingerprints = "/home/bc/data/scratch/lut_reannotate/out/segment_fingerprints.v2.jsonl"
cluster_artifact = "/home/bc/data/scratch/lut_clusters/clusters.render_t1.jsonl"
global_major_limit = 3
global_per_major_limit = 7
local_limit = 9
reach_limit = 300

[source_annotation]
reasoning_effort = "high"

[terra]
endpoints = ["provider-c-lane-1"]
model = "gpt-5.6-terra"
allow_uncached_provider = true
reasoning_effort = "low"
temperature = 0.1
max_output_tokens = 2048
timeout_seconds = 180.0
attempts = 8

[validator]
enabled = false
endpoint = "local"
temperature = 0.1
max_output_tokens = 1024
timeout_seconds = 90.0
attempts = 3

[render]
backend = "cpu_lut"
renderer_revision = "agent-cpu-lut-strength-v2"
search_steps = 5
clip_fraction_max = 0.01

[retention]
keep_audit_forever = true
rejected_image_days = 30
