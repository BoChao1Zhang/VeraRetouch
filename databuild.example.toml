# Canonical databuild configuration. Copy this to an ignored local databuild.toml,
# replace every placeholder, and set its permissions to 0600 before running.
# Config schema revision. Pinned constant: the loader accepts 1 only.
schema_version = 1
# Build identity and ID namespace. Charset: [A-Za-z0-9][A-Za-z0-9._-]{0,127}.
build_id = "example-build"
# Root seed for every deterministic draw: allocation, preset coverage, mask plans.
seed = 0
# Group budget for this build; the run reports completion once it is reached.
target_groups = 10000
# Absolute directory receiving artifacts, JSONL ledgers, and the manifest.
output_root = "/mnt/ramstage/example-build"
# One of: xmp, lrtemplate, lut, all. "all" follows eligible inventory naturally.
preset_filter = "all"

[mix]
# Exact group quotas are computed with deterministic largest-remainder allocation.
# Share of target_groups built as masked (local) edits.
local = 0.70
# Share of target_groups built as whole-image style edits. Both must sum to one.
global = 0.30

[sources]
# 注意：这个路径在本机已不存在，数据在 NFS 归档里。它现在是归档反查表的
# 前缀键（逻辑标识），construct 通过 archive_reader.iter_source_paths() 用它
# 枚举 cache 条目、用 read_bytes() 取字节。不要"修正"成 NFS 路径，否则源池为空。
subject_cache = "/home/bc/data/datasets/vera_directionA_1M/subject_cache"
# Used only for source scene metadata. Credentials remain in the 0600 real TOML.
postgres_dsn = "postgresql://USER:PASSWORD@127.0.0.1:5432/vera_source_qa"

[presets]
# Preset bank root: the features.jsonl inventory plus every renderer payload file.
bank_dir = "/var/cache/veradata/preset_bank_full"
# Two-level style taxonomy JSONL driving coverage-balanced preset selection.
taxonomy = "/var/cache/veradata/preset_bank_full/taxonomy.jsonl"
# Mean CIEDE2000 ceiling for calibrated XMP/LRTemplate GPU replay.
fidelity_de_max = 6.0
# Operator kill switch for a faulty renderer class. Values: xmp, lrtemplate, lut.
disabled_formats = []

[render]
# EXIF-oriented inputs are resized to this short edge for every renderer format.
# Pinned constant: 1024 is the only value the loader accepts.
short_edge = 1024
# Encoder quality of the rendered candidate JPEGs. Pinned constant: 95 only.
jpeg_quality = 95
# Concurrent GPU render slots (semaphore width) on the single render device.
gpu_concurrency = 2
# Images per OneAlign forward pass when ranking a group. Range [1, 8]; 1 = score
# one image at a time.
iaa_batch = 8
# CPU workers for visibility, Lab hint statistics, and JPEG encoding. The
# candidate fan-out is eight; extra workers leave capacity for retries and IO.
# Range [16, 32].
postprocess_workers = 16
# Sources kept in flight behind the ordered selector turn, when the dual OneAlign
# pool is in use. Both scorer copies can be ranking at once, so the window has to
# fund the turn holder plus the sources decoding ahead of it; five is the smallest
# value whose per-group source-thread occupancy drops under the ranking floor.
# Independent of gpu_concurrency, which sizes the render semaphore. Range [1, 8];
# optional — omitting it keeps the built-in 5.
source_window = 5
# Independent OneAlign copies sharing the QA device. Ranking is bounded by one
# copy's serialized forward, so copies are how QA throughput scales. Each costs
# about 16.5 GiB on the 95.6 GiB QA H100, leaving room for SAM3. Range [1, 4];
# optional — omitting it keeps the built-in 2, and 1 is the single-copy rollback.
qa_scorer_instances = 2
# Winner-margin policy, in OneAlign points between a group's best and
# second-best scored candidate. WP5 stage C found the winner beats rank2 only
# 56% of the time (chance) at small gaps and 92% above ten, so a group whose gap
# is under `abstain` publishes no SFT winner at all, one under `low` publishes it
# tagged winner_confidence = "low", and anything above is "normal". Requires
# 0 <= abstain <= low <= 100; both optional — omitting them keeps 1.0 / 2.0, and
# setting both to 0.0 turns the policy off. A group with only one scored
# candidate has no gap to measure and is always "low".
qa_winner_margin_abstain = 1.0
qa_winner_margin_low = 2.0
# CIEDE2000 implementation. "torch" runs on the canonical render GPU;
# "numpy" is the parity oracle and explicit rollback.
visibility_backend = "torch"
# Set false to skip the real OneAlign preflight forward: the CUDA assertion and
# the SDK preflight still run, and the model loads at the QA phase instead. For
# small iteration builds.
qa_preflight_forward = true
# Deterministic working resolution used by the visibility metric.
diff_short_edge = 512
# Alpha-weighted mean CIEDE2000 floor for a candidate to count as a visible edit.
visible_de_min = 2.5
# Per-pixel CIEDE2000 threshold above which a pixel counts as changed.
visible_fraction_de = 2.3
# Weighted fraction of changed pixels also required to pass the gate. Range [0, 1].
visible_fraction_min = 0.50

[masks]
# Fixed linear effective-alpha mean target from the approved mask protocol.
# Pinned constant: 0.50 is the only value the loader accepts.
linear_target_alpha_mass = 0.50
# At most two instance-level SAM3 relabel attempts are allowed.
sam3_relabel_attempts = 2

[annotation]
# Every external provider/key lane uses this single operator-selected model name.
external_model = "configured-by-operator"
# Longest edge of the before/after JPEGs sent to the annotator. Pinned constant: 768.
image_long_edge = 768
# Encoder quality of those annotation JPEGs. Pinned constant: 90.
image_jpeg_quality = 90
# Responses API reasoning effort for external calls. Pinned constant: "low".
external_reasoning_effort = "low"
# Output token ceiling per external annotation call. Pinned constant: 6000.
external_max_output_tokens = 6000
# Across the entire relay pool, not per endpoint.
# Transport retries inside one queue round. Range [1, 4].
transport_attempts_per_round = 4
# Full passes over the pending annotation queue before the item is abandoned. Range [1, 3].
queue_rounds = 3
# Set false for an external-only run that must never route annotation to local vGate.
local_fallback = true

# One table per relay lane (provider plus key); at least one lane is required.
[[annotation.external_endpoints]]
# Lane label used in logs, metrics, and failure records. Must be unique.
id = "provider-a-lane-1"
# OpenAI-compatible Responses API base URL for this lane.
base_url = "https://provider-a.example/v1"
# Lane credential. Redacted from the effective config, logs, and artifacts.
api_key = "REPLACE_WITH_PROVIDER_A_KEY_1"
# In-flight annotation requests allowed on this lane.
concurrency = 16

[[annotation.external_endpoints]]
id = "provider-b-lane-1"
base_url = "https://provider-b.example/v1"
api_key = "REPLACE_WITH_PROVIDER_B_KEY_1"
concurrency = 8

[[annotation.external_endpoints]]
id = "provider-b-lane-2"
base_url = "https://provider-b.example/v1"
api_key = "REPLACE_WITH_PROVIDER_B_KEY_2"
concurrency = 8

[[annotation.external_endpoints]]
id = "provider-c-lane-1"
base_url = "https://provider-c.example/v1"
api_key = "REPLACE_WITH_PROVIDER_C_KEY_1"
concurrency = 8

[[annotation.external_endpoints]]
id = "provider-c-lane-2"
base_url = "https://provider-c.example/v1"
api_key = "REPLACE_WITH_PROVIDER_C_KEY_2"
concurrency = 8

[annotation.local]
# One vGate broker URL; databuild never addresses individual replicas.
base_url = "http://127.0.0.1:8003/v1"
# Placeholder credential; vGate does not authenticate. Still redacted everywhere.
api_key = "EMPTY"
# Local fallback model served by vGate. Pinned constant: qwen3_5-35b-a3b.
model = "qwen3_5-35b-a3b"
# Sampling temperature of the local lane. Pinned constant: 0.2.
temperature = 0.2
# Qwen thinking mode on the local lane. Pinned constant: false.
enable_thinking = false
# Output token ceiling per local annotation call. Pinned constant: 2048.
max_output_tokens = 2048

[viewer]
# Projection only. A viewer PostgreSQL outage cannot change build completion.
postgres_dsn = "postgresql://USER:PASSWORD@127.0.0.1:5432/vera_source_qa"

# Optional r5 legacy import. Keep this whole table commented out in the committed
# example: the moment a legacy_import table exists the run leaves the canonical
# build pipeline for the r5 import pipeline, and the loader then requires
# mix.local=1 (global 0) plus preset_filter set to xmp. A live copy of this table
# lives in databuild.r5migration.toml.
# [legacy_import]
# # Absolute r5 batch directory. output_root must not be inside it.
# input_root = "/home/bc/data/datasets/vera_directionA_1M/r5_local_50k"
# # Legacy groups ledger; must be an existing file inside input_root.
# groups_jsonl = "/home/bc/data/datasets/vera_directionA_1M/r5_local_50k/groups.jsonl"
# # Legacy SFT ledger (stage-1 skeleton); must be an existing file inside input_root.
# sft_jsonl = "/home/bc/data/datasets/vera_directionA_1M/r5_local_50k/sft.jsonl"
