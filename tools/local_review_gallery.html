<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Local · 四类 mask 选图</title>
<style>
:root{color-scheme:light;font:15px/1.5 system-ui,sans-serif;color:#182631;background:#f3f5f7}*{box-sizing:border-box}body{margin:0}header{padding:22px 28px 14px;background:white;border-bottom:1px solid #dce2e7}h1{font-size:25px;margin:0 0 5px}p{margin:5px 0}.muted{color:#617180;font-size:13px}.toolbar{position:sticky;top:0;z-index:5;padding:12px 28px;background:#fffffff2;backdrop-filter:blur(10px);display:flex;align-items:center;gap:9px;flex-wrap:wrap;border-bottom:1px solid #dce2e7}input,select,button{font:inherit;border:1px solid #c6d0d8;border-radius:6px;background:white;padding:7px 10px;color:inherit}button{cursor:pointer}button:hover{background:#e8f0f6}button.primary{background:#185e86;color:white;border-color:#185e86}input[type=search]{width:210px}input[type=checkbox]{accent-color:#185e86;transform:scale(1.15)}.status{margin-left:auto;font-size:13px;color:#617180}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;padding:20px 28px}.card{background:white;border:2px solid transparent;border-radius:9px;overflow:hidden;box-shadow:0 1px 6px #17273815}.card.picked{border-color:#1982b2}.cardhead{padding:10px 12px;display:flex;align-items:center;justify-content:space-between;gap:6px}.cardhead strong{font-size:18px}.pair{display:grid;grid-template-columns:1fr 1fr;gap:5px;padding:0 10px}.pair figure{margin:0;min-width:0;cursor:zoom-in}.pair figcaption{font-size:12px;text-align:center;color:#617180}.pair img{width:100%;height:310px;object-fit:contain;background:#f2f3f4;display:block}.cardinfo{padding:9px 12px 12px;font-size:12px;color:#617180;display:flex;justify-content:space-between}.pager{display:flex;gap:14px;align-items:center;justify-content:center;padding:18px}.selected{background:#e4f0f7;max-height:90px;overflow:auto;padding:8px 28px;font-size:13px}.notice{color:#84530a}dialog{border:0;border-radius:10px;width:min(1320px,96vw);height:94vh;padding:0}dialog::backdrop{background:#111c29b8}.dialoghead{display:flex;align-items:center;gap:12px;position:sticky;top:0;background:#fff;z-index:3;padding:12px 20px;border-bottom:1px solid #ddd}.dialoghead strong{font-size:20px}.dialoghead .close{margin-left:auto}.detail{padding:14px 20px}.detail h2{font-size:17px;margin:16px 0 7px}.detail p{max-width:1100px}.three{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}.three figure,.sequence figure{margin:0;min-width:0}.three img{width:100%;height:380px;object-fit:contain;background:#f2f3f4;display:block}.three figcaption,.sequence figcaption{text-align:center;font-size:13px}.sequence{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}.sequence img{width:100%;height:250px;object-fit:contain;background:#f2f3f4}.reason{border-top:1px solid #dfe5e8;padding:10px 0}.reason strong{color:#185e86}.bar{height:10px;background:linear-gradient(90deg,#000004,#57106e,#bc3754,#f98e09,#fcffa4);width:250px}.ruler{font-size:12px;display:flex;justify-content:space-between;width:250px}.empty{grid-column:1/-1;text-align:center;padding:50px}body:has(dialog[open]){overflow:hidden}@media(max-width:1050px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.toolbar{padding:10px}.grid{padding:12px}.pair img{height:280px}}@media(max-width:650px){.grid{grid-template-columns:1fr}.three img{height:240px}.sequence img{height:180px}.toolbar{position:static}.status{margin-left:0}.detail{padding:10px}.cardhead strong{font-size:16px}}
.frame{position:relative}.frame svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
</style></head><body>
<header><h1>Local · <span id="total"></span> 张候选</h1><p>先看主体局部变化，再勾选你希望放进附录的样本。</p><p class="muted">默认对照最后一步：局部调整前 z₅ → 局部调整后 z₆。可切换主体大裁剪或整条恢复结果；点击照片展开全部阶段与 reasoning。这里是目标条件闭式恢复，不是模型预测。</p></header>
<div class="toolbar"><input id="search" type="search" placeholder="编号 / source ID / 指令关键词" aria-label="搜索"><select id="pool" aria-label="来源"><option value="">全部来源</option><option value="ppr10k">PPR10K</option><option value="unsplash">Unsplash</option><option value="fivek_gold">FiveK</option></select><select id="orientation" aria-label="方向"><option value="">全部方向</option><option value="portrait">竖幅</option><option value="landscape">横幅</option></select><select id="view" aria-label="对照内容"><option value="local">局部步骤：Before / After</option><option value="crop">主体大裁剪：Before / After</option><option value="whole">整条恢复：Input / Final</option></select><select id="sort" aria-label="排序"><option value="id">按编号</option><option value="change">按局部变化幅度</option><option value="color">按主体色彩丰富程度</option><option value="background">按背景细节</option></select><label><input id="onlySelected" type="checkbox">只看已选</label><button class="primary" id="export">导出选中编号</button><button id="copy">复制编号</button><span id="status" class="status"></span></div>
<div id="selected" class="selected"></div><div class="pager"><button class="previous">上一页</button><span class="pageinfo"></span><button class="next">下一页</button></div><main class="grid" id="grid"></main><div class="pager"><button class="previous">上一页</button><span class="pageinfo"></span><button class="next">下一页</button></div>
<dialog id="modal"><div class="dialoghead"><button id="prevDetail">←</button><button id="nextDetail">→</button><strong id="detailTitle"></strong><label><input id="detailSelected" type="checkbox">选这张</label><button class="close" id="close">关闭 ×</button></div><div class="detail" id="detail"></div></dialog>
<script id="records" type="application/json">__RECORDS__</script><script>
'use strict';
const records=JSON.parse(document.getElementById('records').textContent), key='local-review500-20260920-v1';
let chosen=new Set(),page=0,active=null;try{chosen=new Set(JSON.parse(localStorage.getItem(key)||'[]'))}catch{}
const $=id=>document.getElementById(id),pad=n=>String(n).padStart(3,'0'),esc=x=>String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const image=(r,file,label)=>{const [x0,y0,x1,y1]=r.crop.inside.box,[w,h]=r.image_size;const roi=['support','residual'].includes(file)?`<svg viewBox="0 0 ${w} ${h}" aria-label="橙框为主体放大区域"><rect x="${x0}" y="${y0}" width="${x1-x0}" height="${y1-y0}" fill="none" stroke="#ff9a24" stroke-width="2"/></svg>`:'';return `<figure><figcaption>${esc(label)}</figcaption><div class="frame"><img loading="lazy" src="case_${pad(r.number)}/${file}.png" alt="${esc(label)}">${roi}</div></figure>`};
const names=['Global','Hue','Shadows','Midtones','Highlights','Spatial'];
function filtered(){let q=$('search').value.trim().toLowerCase();let rs=records.filter(r=>(!q||[pad(r.number),r.source_id,r.instruction].join(' ').toLowerCase().includes(q))&&(!$('pool').value||r.pool===$('pool').value)&&(!$('orientation').value||r.portrait===($('orientation').value==='portrait'))&&(!$('onlySelected').checked||chosen.has(r.number)));const mode=$('sort').value;rs.sort((a,b)=>mode==='change'?b.local_amplitude-a.local_amplitude:mode==='color'?b.background.fg_chroma-a.background.fg_chroma:mode==='background'?b.background.bg_texture-a.background.bg_texture:a.number-b.number);return rs}
function selectionText(){return [...chosen].sort((a,b)=>a-b).map(pad).join(', ')}
function save(){try{localStorage.setItem(key,JSON.stringify([...chosen]))}catch{}$('selected').textContent=chosen.size?`已选 ${chosen.size} 张：${selectionText()}`:'尚未选择。勾选会保存在当前浏览器；建议最后导出编号。'}
function toggle(n,on){on?chosen.add(n):chosen.delete(n);save();render()}
function render(){const rs=filtered(),pages=Math.max(1,Math.ceil(rs.length/24));page=Math.min(page,pages-1);$('total').textContent=records.length;$('status').textContent=`显示 ${rs.length} 张 · 已选 ${chosen.size} 张`;document.querySelectorAll('.pageinfo').forEach(x=>x.textContent=`${page+1} / ${pages}`);document.querySelectorAll('.previous').forEach(x=>x.disabled=page===0);document.querySelectorAll('.next').forEach(x=>x.disabled=page===pages-1);const view=$('view').value,files=view==='crop'?['crop_before','crop_after']:view==='whole'?['input','after']:['before','after'];const labels=view==='whole'?['Input · z₀','Final · z₆']:['Before · z₅','After · z₆'];$('grid').innerHTML=rs.slice(page*24,(page+1)*24).map(r=>`<article class="card ${chosen.has(r.number)?'picked':''}"><div class="cardhead"><strong>#${pad(r.number)}</strong><span>${esc(r.pool)} · ${r.image_size.join('×')}</span><label><input type="checkbox" data-select="${r.number}" ${chosen.has(r.number)?'checked':''}> 选择</label></div><div class="pair" data-open="${r.number}">${image(r,files[0],labels[0])}${image(r,files[1],labels[1])}</div><div class="cardinfo"><span>${esc(r.source_id)}</span><span>主体变化 ${r.local_amplitude.toFixed(2)} /100</span></div></article>`).join('')||'<div class="empty">没有符合筛选条件的样本。</div>';save()}
function openDetail(n){active=n;const r=records.find(x=>x.number===n);$('detailTitle').textContent=`#${pad(n)} · ${r.source_id}`;$('detailSelected').checked=chosen.has(n);$('detail').innerHTML=`<p><b>Instruction</b> · ${esc(r.instruction)}</p><h2>1 · 整条恢复</h2><div class="three">${image(r,'input','Input · z₀')}${image(r,'after','Final · z₆')}${image(r,'gt','Reference')}</div><h2>2 · 最后一步局部变化</h2><div class="three">${image(r,'support','Recorded support')}${image(r,'before','Before · z₅')}${image(r,'after','After · z₆')}</div><h2>3 · 主体大裁剪与真实残差</h2><div class="three">${image(r,'residual','Actual residual · |z₆ − z₅|')}${image(r,'crop_before','Before · subject ROI')}${image(r,'crop_after','After · same ROI')}</div><div class="bar"></div><div class="ruler"><span>0</span><span>${r.residual_max} · MAE ×100</span></div><p class="muted">主体裁剪占全图 ${(100*r.crop.inside.area_fraction).toFixed(1)}%，其中 ${(100*r.crop.inside.subject_fraction).toFixed(1)}% 位于主体支持域内。照片未增强显示对比度。热力图为真实相邻状态差值，不同样本的色标上限单独标明。</p><h2>4 · 六步过程</h2><div class="sequence">${['input','z1','z2','z3','z4','before','after','gt'].map((f,i)=>image(r,f,i===0?'Input':i===7?'Reference':`z${i} · ${names[i-1]}`)).join('')}</div><h2>Archived reasoning · 原始标注</h2>${r.annotation.cot.map(s=>`<div class="reason"><strong>${s.step} · ${names[s.step-1]}</strong><p><b>Observation</b> ${esc(s.observation)}</p><p><b>Support</b> ${esc(s.mask)}</p><details><summary>完整 adjustment</summary><p>${esc(s.adjustment)}</p></details></div>`).join('')}`;if(!$('modal').open)$('modal').showModal();$('modal').scrollTop=0}
function moveDetail(d){const rs=filtered(),i=rs.findIndex(r=>r.number===active),next=rs[i+d];if(next)openDetail(next.number)}
$('grid').addEventListener('change',e=>{if(e.target.dataset.select)toggle(Number(e.target.dataset.select),e.target.checked)});$('grid').addEventListener('click',e=>{let p=e.target.closest('[data-open]');if(p)openDetail(Number(p.dataset.open))});
for(const id of ['pool','orientation','view','sort','onlySelected'])$(id).addEventListener('change',()=>{page=0;render()});$('search').addEventListener('input',()=>{page=0;render()});
document.querySelectorAll('.previous').forEach(b=>b.onclick=()=>{page--;render();window.scrollTo({top:0})});document.querySelectorAll('.next').forEach(b=>b.onclick=()=>{page++;render();window.scrollTo({top:0})});$('close').onclick=()=>$('modal').close();$('detailSelected').onchange=e=>toggle(active,e.target.checked);$('prevDetail').onclick=()=>moveDetail(-1);$('nextDetail').onclick=()=>moveDetail(1);
$('export').onclick=()=>{const selected=records.filter(r=>chosen.has(r.number)).map(r=>({number:pad(r.number),source_id:r.source_id,key:r.key}));const blob=new Blob([JSON.stringify({gallery:'local-review500-20260920-v1',selected},null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='local-selected.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};
$('copy').onclick=async()=>{try{await navigator.clipboard.writeText(selectionText());$('status').textContent='编号已复制'}catch{window.prompt('复制这些编号：',selectionText())}};
document.addEventListener('keydown',e=>{if($('modal').open&&e.key==='ArrowRight')moveDetail(1);if($('modal').open&&e.key==='ArrowLeft')moveDetail(-1)});render();
</script>
<script>
// Geometry comes from the construction journal, not a keyword in reasoning.
const geometryNames={semantic:'主体语义',subject:'主体语义',radial:'径向',band:'带状',linear:'线性渐变'};
const geometrySelect=document.createElement('select');geometrySelect.id='geometry';geometrySelect.setAttribute('aria-label','Mask 类型');
geometrySelect.innerHTML='<option value="">全部 mask</option><option value="nonsemantic">仅几何 mask</option><option value="semantic">主体语义</option><option value="radial">径向 Radial</option><option value="band">带状 Band</option><option value="linear">线性渐变 Linear</option>';
$('pool').before(geometrySelect);
const requestedGeometry=new URLSearchParams(location.search).get('geometry');
geometrySelect.value=requestedGeometry===null?(records.some(r=>r.geometry_kind!=='semantic')?'nonsemantic':''):(requestedGeometry==='all'?'':requestedGeometry);
const filterByOtherFields=filtered;
filtered=function(){return filterByOtherFields().filter(r=>!geometrySelect.value||(geometrySelect.value==='nonsemantic'?!['semantic','subject'].includes(r.geometry_kind):r.geometry_kind===geometrySelect.value))};
const renderBase=render;
const saveBase=save;
save=function(){saveBase();const counts={semantic:0,radial:0,band:0,linear:0};for(const r of records)if(chosen.has(r.number)&&r.geometry_kind in counts)counts[r.geometry_kind]++;$('selected').textContent+=' ｜ 四类覆盖：'+Object.entries(counts).map(([k,v])=>`${geometryNames[k]} ${v}`).join(' / ')};
render=function(){renderBase();document.title=`Local · ${records.length} 张 / 四类 mask`;document.querySelectorAll('.card').forEach(card=>{const r=records.find(x=>x.number===Number(card.querySelector('[data-select]').dataset.select));const tag=document.createElement('span');tag.textContent=geometryNames[r.geometry_kind]||r.geometry_kind;tag.style.cssText='font-size:12px;color:#185e86;padding:0 12px 6px;display:block';card.querySelector('.cardhead').after(tag);const score=card.querySelector('.cardinfo span:last-child');score.textContent=score.textContent.replace('主体变化','区域变化')})};
const detailBase=openDetail;
openDetail=function(n){detailBase(n);const r=records.find(x=>x.number===n);$('detailTitle').textContent+=` · ${geometryNames[r.geometry_kind]||r.geometry_kind}`;$('detail').querySelectorAll('h2').forEach(h=>h.textContent=h.textContent.replace('主体大裁剪','编辑区域大裁剪'));$('detail').querySelectorAll('svg').forEach(s=>s.setAttribute('aria-label','橙框为放大区域'));if(!['semantic','subject'].includes(r.geometry_kind)){const note=$('detail').querySelector('p.muted');note.textContent=`编辑 ROI 占全图 ${(100*r.crop.inside.area_fraction).toFixed(1)}%，其中 ${(100*r.crop.inside.active_fraction).toFixed(1)}% 位于当前 mask 的有效支持域。橙框对应放大区域，照片没有增强显示对比度。热力图取真实相邻状态差值。`;$('detail').querySelectorAll('figcaption').forEach(c=>c.textContent=c.textContent.replace('subject ROI','edit ROI'));if(r.crop.outside_kind==='low_support'){const p=document.createElement('p');p.className='muted';p.textContent='此渐变没有足够大的严格零权重区域：低权重区域不是未编辑区。';note.after(p)}}};
geometrySelect.onchange=()=>{page=0;render()};
$('view').querySelector('[value="crop"]').textContent='编辑区域大裁剪：Before / After';
$('sort').querySelector('[value="color"]').textContent='按编辑区域色彩';$('sort').querySelector('[value="background"]').textContent='按对照区域细节';
document.querySelector('header h1').innerHTML='Local · <span id="total"></span> 张候选 / 四类空间 mask';
document.querySelector('header>p').textContent='四张附录图按主体语义、径向、带状、线性渐变各选一张。原编号 001–500 保留，501 起为新增几何候选。';
render();
</script></body></html>
