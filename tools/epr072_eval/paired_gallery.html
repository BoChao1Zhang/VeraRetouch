<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>六阶段 · CoT 配对对照</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f5f7;color:#243340;font:15px/1.55 system-ui,sans-serif}header,nav,main{max-width:1800px;margin:auto;padding:12px 24px}header{padding-bottom:2px}h1{font-size:22px;margin:0}p{margin:6px 0}.muted{color:#657482;font-size:12px}nav{display:flex;gap:9px;align-items:center;flex-wrap:wrap;position:sticky;top:0;background:#ffffffed;z-index:3}button,select,input{font:inherit;padding:7px;border:1px solid #bac7d0;border-radius:4px;background:white;color:inherit}button{cursor:pointer}.pair{display:grid;grid-template-columns:1fr 1fr;gap:5px}figure{margin:0;min-width:0;background:white}figcaption{text-align:center;padding:6px;font-weight:600}figure img{display:block;width:100%;height:55vh;object-fit:contain;cursor:crosshair;background:#eee}.stats{font-size:12px;font-weight:400;color:#52606a}#instruction{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px;margin:6px 0 12px;cursor:pointer}#instruction.expanded{white-space:normal}.context img{height:36vh}.zoom img{height:32vh;object-fit:contain}.panel{padding:12px;background:white;margin:12px 0}summary{cursor:pointer;font-weight:600}#text{white-space:pre-wrap;font-size:13px;max-height:600px;overflow:auto}.steps{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}.active{background:#235d7d;color:white}.chip{font-size:12px;background:#e8eef2;padding:3px 8px;border-radius:4px}#zoomLabel{font-size:13px}a{color:#235d7d}@media(max-width:750px){main,header,nav{padding:10px}.pair img{height:38vh}}
</style>
<header><h1>六阶段结果：With CoT / Without CoT</h1><p class="muted">PIX@3200 · ArtEdit 400 张 · 同输入、同指令、同执行器。默认按编号，不按胜负选图。照片未经额外调色。</p></header>
<nav><button id="prev">← 上一张</button><select id="sample"></select><button id="next">下一张 →</button><input id="search" placeholder="编号或指令关键词"><span id="count"></span><span id="replayFlag" class="chip"></span></nav>
<main><div id="instruction" title="点击展开完整指令"></div><div class="pair" id="outputs"></div><p class="muted">点击任一输出：按相同原图坐标同步放大。原始图片可在下方链接打开。</p><section class="panel" id="zoomPanel" hidden><div id="zoomLabel"></div><div class="pair zoom" id="zooms"></div></section><details class="panel" id="context"><summary>输入 / 参考图</summary><div class="pair context" id="sources"></div></details><section class="panel"><b>逐步对照</b><div id="stepNote" class="muted"></div><div class="steps" id="steps"></div><div class="pair" id="stagePair"></div></section><details class="panel"><summary>实际 With-CoT 六段文本</summary><div id="text"></div></details><div class="muted">前 8 张提供阶段 1–5 的归档颜色码重放，并核对每步变化量；阶段 6 始终使用原始评测输出。其余 392 张目前提供最终配对输出。</div></main>
<script>
const $=id=>document.getElementById(id),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let all=[],shown=[],pos=0,step=6;
const names=['Input','Global','Hue','Shadows','Midtones','Highlights','Subject / Final'];
function url(r,m,k=6){return `${r.id}/${k===0?'input.jpg':k===6?m+'.png':m+'_z'+k+'.png'}`}
function panel(r,m,k=6,stats=false){const v=r.modes[m],label=m==='cot'?'With CoT':'Without CoT';return `<figure><figcaption>${label}${stats?`<div class="stats">PSNR ${v.psnr.toFixed(2)} · L1×100 ${v.l1.toFixed(2)} · SC ${v.sc.toFixed(2)} · PQ ${v.pq.toFixed(2)}</div>`:''}</figcaption><img data-mode="${m}" src="${url(r,m,k)}" alt="${label} ${names[k]}"><figcaption class="stats"><a href="${url(r,m,k)}" target="_blank">打开原图</a></figcaption></figure>`}
function renderStage(){const r=shown[pos];$('steps').innerHTML=(r.replay?[0,1,2,3,4,5,6]:[0,6]).map(k=>`<button data-step="${k}" class="${step===k?'active':''}">${k} · ${names[k]}</button>`).join('');$('stagePair').innerHTML=['cot','nocot'].map(m=>panel(r,m,step)).join('');$('stepNote').textContent=r.replay?'点击阶段，比较该步累积输出。两列始终是同一步。':'此样本仅有归档最终图；可用前 8 张查看逐步重放。'}
function render(){const r=shown[pos];if(!r)return;$('sample').value=r.id;$('count').textContent=`${pos+1} / ${shown.length}`;$('prev').disabled=pos===0;$('next').disabled=pos===shown.length-1;$('instruction').textContent=r.instruction;$('instruction').classList.remove('expanded');$('outputs').innerHTML=['cot','nocot'].map(m=>panel(r,m,6,true)).join('');$('sources').innerHTML=['input','reference'].map(x=>`<figure><figcaption>${x==='input'?'Input':'Reference'}</figcaption><img src="${r.id}/${x}.jpg"></figure>`).join('');$('text').textContent=r.cot_text;$('replayFlag').textContent=r.replay?'可查看 6 步':'最终结果';$('zoomPanel').hidden=true;step=6;renderStage();history.replaceState(null,'','#'+r.id)}
function filter(){const q=$('search').value.toLowerCase().trim();shown=all.filter(r=>(r.id+' '+r.instruction).toLowerCase().includes(q));$('sample').innerHTML=shown.map(r=>`<option value="${r.id}">${r.id}${r.replay?' · 含步骤':''}</option>`).join('');pos=0;if(shown.length)render();else{$('count').textContent='无匹配样本';$('prev').disabled=$('next').disabled=true}}
async function zoom(e){const img=e.target;if(img.tagName!=='IMG'||!img.dataset.mode)return;const r=shown[pos],b=img.getBoundingClientRect(),scale=Math.min(b.width/img.naturalWidth,b.height/img.naturalHeight),w=img.naturalWidth*scale,h=img.naturalHeight*scale,x=(e.clientX-b.left-(b.width-w)/2)/w,y=(e.clientY-b.top-(b.height-h)/2)/h;if(x<0||x>1||y<0||y>1)return;const cropW=Math.round(img.naturalWidth*.30),cropH=Math.min(Math.round(cropW*.75),img.naturalHeight),left=Math.max(0,Math.min(img.naturalWidth-cropW,Math.round(x*img.naturalWidth-cropW/2))),top=Math.max(0,Math.min(img.naturalHeight-cropH,Math.round(y*img.naturalHeight-cropH/2)));const k=img.closest('#stagePair')?step:6;$('zooms').innerHTML='';for(const m of ['cot','nocot']){const source=new Image();source.src=url(r,m,k);await source.decode();const canvas=document.createElement('canvas');canvas.width=cropW;canvas.height=cropH;canvas.getContext('2d').drawImage(source,left,top,cropW,cropH,0,0,cropW,cropH);$('zooms').insertAdjacentHTML('beforeend',`<figure><figcaption>${m==='cot'?'With CoT':'Without CoT'}</figcaption><img src="${canvas.toDataURL()}" alt="matched crop"></figure>`)}$('zoomLabel').textContent=`阶段 ${k} · 相同裁剪坐标 (${left}, ${top}, ${cropW}, ${cropH})`;$('zoomPanel').hidden=false}
$('prev').onclick=()=>{pos--;render()};$('next').onclick=()=>{pos++;render()};$('sample').onchange=()=>{pos=shown.findIndex(r=>r.id===$('sample').value);render()};$('search').oninput=filter;$('instruction').onclick=()=>$('instruction').classList.toggle('expanded');$('steps').onclick=e=>{if(e.target.dataset.step!==undefined){step=Number(e.target.dataset.step);renderStage()}};$('outputs').onclick=zoom;$('stagePair').onclick=zoom;document.onkeydown=e=>{if(['INPUT','SELECT','TEXTAREA'].includes(e.target.tagName))return;if(e.key==='ArrowRight'&&pos<shown.length-1){pos++;render()}if(e.key==='ArrowLeft'&&pos>0){pos--;render()}};
fetch('records.json').then(r=>r.json()).then(rows=>{all=rows;const selected=location.hash.slice(1);filter();if(selected){const i=shown.findIndex(r=>r.id===selected);if(i>=0){pos=i;render()}}});
</script></html>
