<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Figure 4 · 用户选定候选</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f5f7;color:#20323e;font:14px/1.5 system-ui,sans-serif}header{padding:14px 22px;background:white}h1{font-size:22px;margin:0}p{margin:5px 0}.muted{color:#657784;font-size:12px}.toolbar{position:sticky;top:0;z-index:5;background:#ffffffef;display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 22px;border-bottom:1px solid #ccd6dd}input,select,button{font:inherit;padding:6px 9px;border:1px solid #b5c6d0;border-radius:4px;background:white;color:inherit}button{cursor:pointer}.primary{background:#205d7e;color:white}.group{margin:18px 22px 8px;font-size:18px}.case{margin:8px 18px 18px;background:white;border:2px solid transparent;padding:8px;border-radius:5px;content-visibility:auto;contain-intrinsic-size:auto 410px}.case.picked{border-color:#267ba6}.head{display:flex;align-items:center;gap:12px}.head label{margin-left:auto}.instruction{font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin:3px 0 6px;cursor:pointer}.instruction.open{white-space:normal}.images{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:5px}.images.zoom{margin-top:8px}figure{margin:0;min-width:0}figcaption{text-align:center;font-size:13px;padding:3px}img{display:block;width:100%;height:auto;cursor:crosshair;background:#eef1f3}.images.zoom img{aspect-ratio:4/3;object-fit:contain}.badge{font-size:12px;background:#e6eef3;border-radius:4px;padding:2px 7px}.missing{background:#eee;min-height:120px;display:grid;place-items:center;color:#a03a2e}.warning{color:#a03a2e;font-size:12px}.notice{font-size:12px;color:#a03a2e;min-height:18px}dialog{width:min(1600px,96vw);max-height:94vh;border:0;padding:16px}dialog::backdrop{background:#142637b8}dialog img{width:100%;max-height:80vh;object-fit:contain}.preview{margin:10px 22px}.empty{padding:30px;text-align:center}@media(max-width:800px){.case{overflow:auto}.images{min-width:950px}.toolbar{position:static}.group{margin-left:12px}}
.head label+label{margin-left:8px}
[hidden]{display:none!important}
</style>
<header><h1>Figure 4 选图：不限量初选 → 最终 6 组</h1><p class="muted">只含你给出的编号。每行同一输入与指令，模型顺序与 Figure 4 一致；Ours 为 PIX@3200 六阶段输出。249、377、394 使用 With CoT，其余使用 Without CoT。</p></header>
<div class="toolbar"><select id="orientation"><option value="">全部：横向 → 纵向</option><option value="landscape">只看横向</option><option value="portrait">只看纵向</option></select><input id="search" placeholder="编号 / 指令关键词"><select id="view"><option value="all">① 全部：不限量初选</option><option value="shortlist">② 已选候选：确定最终 6 组</option><option value="final">③ 只看最终入选</option></select><strong id="counts"></strong><button id="exportCandidates">导出初选</button><button id="export" class="primary">导出最终选择</button><span id="message" class="notice"></span></div>
<div class="preview muted">点击任一图片可同时放大该行五张图的同一位置；点击指令展开原文。第一轮可不限量勾选“加入候选”；切换到“② 已选候选”后，再勾选“最终入选”。目标 6 组，横向／纵向分别显示计数。</div><main id="rows"></main>
<script>
const $=id=>document.getElementById(id),key='figure4-user-selection-20260921-v1',methods=['input','jarvisevo','monetgpt','veraretouch','ours'],names={input:'Input',jarvisevo:'JarvisEvo',monetgpt:'MonetGPT',veraretouch:'VeraRetouch',ours:'Ours'};let all=[],picked=new Set(),finalPicked=new Set();try{picked=new Set(JSON.parse(localStorage.getItem(key)||'[]'));finalPicked=new Set(JSON.parse(localStorage.getItem(key+'-final')||'[]'))}catch{}
const esc=x=>String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function counts(set=finalPicked){return Object.fromEntries(['landscape','portrait'].map(o=>[o,all.filter(r=>r.orientation===o&&set.has(r.id)).length]))}
function save(){localStorage.setItem(key,JSON.stringify([...picked]));localStorage.setItem(key+'-final',JSON.stringify([...finalPicked]));const n=counts();$('counts').textContent=`候选 ${picked.size} 组 · 最终 ${finalPicked.size}/6（横 ${n.landscape} · 纵 ${n.portrait}）`}
function toggle(id,on){const r=all.find(r=>r.id===id);if(on&&!r.complete)return;if(on)picked.add(id);else{picked.delete(id);finalPicked.delete(id)}$('message').textContent='';render()}
function toggleFinal(id,on){const r=all.find(r=>r.id===id);if(on&&(!r.complete||!picked.has(id)))return;if(on&&!finalPicked.has(id)&&finalPicked.size>=6){$('message').textContent='最终已选 6 组，请先取消一组再替换；初选候选仍可不限量添加。';render();return}if(on)finalPicked.add(id);else finalPicked.delete(id);$('message').textContent='';render()}
function render(){const q=$('search').value.trim().toLowerCase(),rs=all.filter(r=>(!$('orientation').value||r.orientation===$('orientation').value)&&($('view').value==='all'||($('view').value==='shortlist'?picked:finalPicked).has(r.id))&&(!q||(r.id+' '+r.original_token+' '+r.instruction).toLowerCase().includes(q)));let previous='';$('rows').innerHTML=rs.map(r=>{const heading=previous===r.orientation?'':`<h2 class="group">${r.orientation==='landscape'?'横向图片':'纵向图片'}</h2>`;previous=r.orientation;return heading+`<article id="${r.id}" class="case ${picked.has(r.id)?'picked':''}"><div class="head"><b>${String(r.number).padStart(4,'0')}</b><span class="badge">${r.size[0]} × ${r.size[1]}</span><span class="badge">Ours · ${r.mode==='cot'?'With CoT':'Without CoT'}</span><label><input type="checkbox" data-pick="${r.id}" ${picked.has(r.id)?'checked':''} ${r.complete?'':'disabled'}>加入候选</label>${$('view').value==='all'?'':`<label><input type="checkbox" data-final="${r.id}" ${finalPicked.has(r.id)?'checked':''} ${r.complete?'':'disabled'}>最终入选</label>`}${finalPicked.has(r.id)?'<span class="badge">★ 最终入选</span>':''}</div><div class="instruction" title="点击展开">${esc(r.instruction)}</div>${r.complete?'':`<p class="warning">需核实：缺失 ${esc(r.missing.join(', '))}；尺寸异常 ${esc(JSON.stringify(r.geometry_mismatch))}。不以其他输出替代。</p>`}<div class="images">${methods.map(m=>`<figure><figcaption>${names[m]}${m==='ours'?(r.mode==='cot'?' · CoT':' · no-CoT'):''}</figcaption>${r.images[m]?`<img loading="lazy" data-id="${r.id}" src="${r.images[m]}" alt="${r.id} ${names[m]}" width="${r.size[0]}" height="${r.size[1]}">`:'<div class="missing">暂无真实输出</div>'}</figure>`).join('')}</div><div class="images zoom" id="zoom-${r.id}" hidden></div></article>`}).join('')||'<div class="empty">没有匹配项</div>';save()}
async function zoom(img,event){const r=all.find(r=>r.id===img.dataset.id);if(!r.complete)return;await img.decode();const b=img.getBoundingClientRect(),x=(event.clientX-b.left)/b.width,y=(event.clientY-b.top)/b.height,W=r.size[0],H=r.size[1],cw=Math.round(W*.35),ch=Math.min(H,Math.round(cw*.75)),left=Math.max(0,Math.min(W-cw,Math.round(x*W-cw/2))),top=Math.max(0,Math.min(H-ch,Math.round(y*H-ch/2))),dest=$('zoom-'+r.id);dest.innerHTML='';for(const m of methods){const source=new Image();source.src=r.images[m];await source.decode();const canvas=document.createElement('canvas');canvas.width=cw;canvas.height=ch;canvas.getContext('2d').drawImage(source,left,top,cw,ch,0,0,cw,ch);dest.insertAdjacentHTML('beforeend',`<figure><figcaption>${names[m]} · 相同局部</figcaption><img src="${canvas.toDataURL()}" alt="matched crop"></figure>`)}dest.hidden=false}
$('rows').onchange=e=>{if(e.target.dataset.pick)toggle(e.target.dataset.pick,e.target.checked);if(e.target.dataset.final)toggleFinal(e.target.dataset.final,e.target.checked)};$('rows').onclick=e=>{if(e.target.classList.contains('instruction'))e.target.classList.toggle('open');else if(e.target.dataset.id)zoom(e.target,e)};for(const id of ['orientation','view'])$(id).onchange=render;$('search').oninput=render;
function exportSelection(finalOnly){const set=finalOnly?finalPicked:picked,selected=all.filter(r=>set.has(r.id)).map(r=>({sample_id:r.id,number:r.number,orientation:r.orientation,mode:r.mode,checkpoint:'PIX3200',execution:'six-stage',sha256:r.sha256}));const payload={gallery:key,stage:finalOnly?'final':'shortlist',expected:{total:6,landscape:3,portrait:3},counts:counts(set),candidate_ids:all.filter(r=>picked.has(r.id)).map(r=>r.id),selected};const a=document.createElement('a'),url=URL.createObjectURL(new Blob([JSON.stringify(payload,null,2)],{type:'application/json'}));a.href=url;a.download=finalOnly?'figure4-final-selected.json':'figure4-shortlist.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);$('message').textContent=finalOnly?(selected.length===6?'已导出最终 6 组':'已导出当前最终选择，尚未选满 6 组'):`已导出 ${selected.length} 组初选候选`;}
$('export').onclick=()=>exportSelection(true);$('exportCandidates').onclick=()=>exportSelection(false);
fetch('records.json').then(r=>r.json()).then(records=>{all=records;picked=new Set([...picked].filter(id=>all.some(r=>r.id===id)));finalPicked=new Set([...finalPicked].filter(id=>picked.has(id)&&all.some(r=>r.id===id&&r.complete)));render()});
</script></html>
