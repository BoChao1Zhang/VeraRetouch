<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>风光选图 · 色相与亮度蒙版</title><style>
*{box-sizing:border-box}body{margin:0;background:#f3f5f7;color:#243442;font:15px/1.5 system-ui,sans-serif}header{background:white;padding:20px 26px;border-bottom:1px solid #d8e1e8}h1{font-size:24px;margin:0}p{margin:6px 0}.muted{font-size:12px;color:#617381}.toolbar{position:sticky;top:0;background:#fffffff5;z-index:5;display:flex;gap:9px;flex-wrap:wrap;padding:12px 26px;border-bottom:1px solid #d8e1e8}select,input,button{font:inherit;padding:7px 10px;border:1px solid #c8d3dc;border-radius:5px;background:white;color:inherit}button{cursor:pointer}button.primary{background:#185e86;color:white}input[type=checkbox]{accent-color:#185e86}.selection{background:#e7f0f6;padding:8px 26px;max-height:85px;overflow:auto}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;padding:16px 26px}.card{background:white;border-radius:8px;border:2px solid transparent;overflow:hidden}.card.selected{border-color:#1682ab}.cardheader{display:flex;justify-content:space-between;padding:9px 12px}.pair{display:grid;grid-template-columns:1fr 1fr;gap:5px;padding:0 10px;cursor:zoom-in}figure{margin:0;min-width:0}figcaption{text-align:center;font-size:12px;color:#617381}img{display:block;width:100%;height:225px;object-fit:contain;background:#f1f3f4}.info{display:flex;justify-content:space-between;padding:9px 12px;font-size:12px;color:#617381}.pager{display:flex;align-items:center;justify-content:center;gap:14px;padding:12px}dialog{border:0;border-radius:8px;width:min(1400px,96vw);height:94vh;padding:0}dialog::backdrop{background:#172331ba}.dialoghead{position:sticky;top:0;z-index:4;background:white;display:flex;gap:10px;align-items:center;padding:12px 20px;border-bottom:1px solid #ddd}.dialoghead .close{margin-left:auto}.detail{padding:14px 20px}.detail h2{font-size:17px;margin:18px 0 8px}.three{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}.three img{height:300px}.four{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}.four img{height:210px}.block{margin:12px 0;border-top:1px solid #ddd;padding-top:8px}.bar{height:10px;width:260px;background:linear-gradient(90deg,#000004,#57106e,#bc3754,#f98e09,#fcffa4)}.ruler{display:flex;justify-content:space-between;width:260px;font-size:12px}.empty{grid-column:1/-1;text-align:center;padding:50px}body:has(dialog[open]){overflow:hidden}@media(max-width:850px){.grid{grid-template-columns:1fr}.toolbar{position:static}.three img{height:210px}.four img{height:160px}}
</style></head><body><header><h1>风光选图 · <span id="count"></span> 张</h1><p>直接对照输入与最终结果（z0 → z6）。点击图片可查看蒙版、局部放大和逐步恢复。</p><p class="muted">按场景词和调整风格分组抽样；分组用于选图，不是人工验证的场景分类。这里是目标条件闭式恢复，不是模型预测。编号以 L 开头，与上一轮人像候选分开。</p></header>
<div class="toolbar"><input id="search" placeholder="L 编号 / 关键词"><select id="scene"><option value="">全部场景</option></select><select id="style"><option value="">全部风格</option></select><label><input type="checkbox" id="only">只看已选</label><button class="primary" id="export">导出选中编号</button><span id="status"></span></div>
<div id="selected" class="selection"></div><div class="pager"><button class="prev">上一页</button><span class="page"></span><button class="next">下一页</button></div><main id="grid" class="grid"></main><div class="pager"><button class="prev">上一页</button><span class="page"></span><button class="next">下一页</button></div>
<dialog id="modal"><div class="dialoghead"><button id="prevDetail">←</button><button id="nextDetail">→</button><b id="title"></b><label><input type="checkbox" id="detailPick">选择</label><button class="close" id="close">关闭 ×</button></div><div class="detail" id="detail"></div></dialog>
<script id="records" type="application/json">__RECORDS__</script><script>
'use strict';const records=JSON.parse(document.getElementById('records').textContent),$=id=>document.getElementById(id),names={2:'色相 / Hue',3:'阴影 / Shadows',4:'中间调 / Midtones',5:'高光 / Highlights'},key='landscape-review500-20260920-v1';let chosen=new Set(),page=0,current=null;try{chosen=new Set(JSON.parse(localStorage.getItem(key)||'[]'))}catch{}
const esc=x=>String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const picture=(r,file,label)=>`<figure><figcaption>${esc(label)}</figcaption><img loading="lazy" src="${r.id}/${file}.png" alt="${esc(label)}"></figure>`;
for(const [id,field] of [['scene','scene_bucket'],['style','style_bucket']])for(const name of [...new Set(records.map(r=>r[field]))].sort())$(id).add(new Option(name,name));
function filtered(){const q=$('search').value.trim().toLowerCase();return records.filter(r=>(!q||[r.id,r.source_id,r.instruction,r.scene_bucket,r.style_bucket].join(' ').toLowerCase().includes(q))&&(!$('scene').value||r.scene_bucket===$('scene').value)&&(!$('style').value||r.style_bucket===$('style').value)&&(!$('only').checked||chosen.has(r.id))).sort((a,b)=>a.number-b.number)}
function save(){try{localStorage.setItem(key,JSON.stringify([...chosen]))}catch{}$('selected').textContent=chosen.size?`已选 ${chosen.size} 张：${[...chosen].sort().join(', ')}`:'尚未选择；勾选后可以导出编号。'}
function toggle(id,on){on?chosen.add(id):chosen.delete(id);render()}
function render(){const rs=filtered(),pages=Math.max(1,Math.ceil(rs.length/20));page=Math.min(page,pages-1);$('count').textContent=records.length;$('status').textContent=`显示 ${rs.length} / ${records.length}`;document.querySelectorAll('.page').forEach(x=>x.textContent=`${page+1} / ${pages}`);document.querySelectorAll('.prev').forEach(x=>x.disabled=page===0);document.querySelectorAll('.next').forEach(x=>x.disabled=page===pages-1);$('grid').innerHTML=rs.slice(page*20,(page+1)*20).map(r=>`<article class="card ${chosen.has(r.id)?'selected':''}"><div class="cardheader"><strong>${r.id}</strong><label><input type="checkbox" data-pick="${r.id}" ${chosen.has(r.id)?'checked':''}>选择</label></div><div class="pair" data-open="${r.id}">${picture(r,'z0','输入 · Input (z0)')}${picture(r,'z6','最终结果 · Final (z6)')}</div><div class="info"><span>${esc(r.scene_bucket)} · ${esc(r.style_bucket)}</span><span>点击查看过程</span></div></article>`).join('')||'<div class="empty">没有符合条件的样本，请调整筛选条件。</div>';save()}
function detail(id){current=id;const r=records.find(x=>x.id===id);$('title').textContent=`${id} · ${r.scene_bucket}`;$('detailPick').checked=chosen.has(id);$('detail').innerHTML=`<p><b>Instruction</b> · ${esc(r.instruction)}</p><h2>整体恢复</h2><div class="three">${picture(r,'z0','Input')}${picture(r,'z6','Final')}${picture(r,'reference','Reference')}</div>${[2,3,4,5].map(s=>`<h2>${names[s]} · z${s-1} → z${s}</h2><div class="three">${picture(r,`${s}_support`,'Recorded support')}${picture(r,`z${s-1}`,'Before')}${picture(r,`z${s}`,'After')}</div><div class="three">${picture(r,`${s}_residual`,'Actual residual')}${picture(r,`${s}_before_crop`,'Before / same ROI')}${picture(r,`${s}_after_crop`,'After / same ROI')}</div><p class="muted">有效范围 ${(r.steps[s].active_fraction*100).toFixed(1)}%；区域变化 ${r.steps[s].active_change.toFixed(2)} /100。</p><div class="block"><b>Observation</b> ${esc(r.annotation.cot[s-1].observation)}<p><b>Support</b> ${esc(r.annotation.cot[s-1].mask)}</p></div>`).join('')}<div class="bar"></div><div class="ruler"><span>0</span><span>${r.residual_max} · MAE ×100</span></div><p class="muted">同一样本四个阶段使用相同残差色标；前后裁剪坐标完全相同，照片未增强显示对比度。文字为原始标注。</p><h2>六步概览</h2><div class="four">${['z0','z1','z2','z3','z4','z5','z6','reference'].map(f=>picture(r,f,f)).join('')}</div>`;if(!$('modal').open)$('modal').showModal();$('modal').scrollTop=0}
function move(d){const rs=filtered(),i=rs.findIndex(r=>r.id===current);if(rs[i+d])detail(rs[i+d].id)}
for(const id of ['scene','style','only'])$(id).onchange=()=>{page=0;render()};$('search').oninput=()=>{page=0;render()};$('grid').onchange=e=>{if(e.target.dataset.pick)toggle(e.target.dataset.pick,e.target.checked)};$('grid').onclick=e=>{const card=e.target.closest('[data-open]');if(card)detail(card.dataset.open)};document.querySelectorAll('.prev').forEach(b=>b.onclick=()=>{page--;render();scrollTo(0,0)});document.querySelectorAll('.next').forEach(b=>b.onclick=()=>{page++;render();scrollTo(0,0)});$('close').onclick=()=>$('modal').close();$('detailPick').onchange=e=>toggle(current,e.target.checked);$('prevDetail').onclick=()=>move(-1);$('nextDetail').onclick=()=>move(1);
</script><script>
let selectedStages={};try{selectedStages=JSON.parse(localStorage.getItem(key+'-stages')||'{}')}catch{}
const saveOriginal=save;save=function(){saveOriginal();try{localStorage.setItem(key+'-stages',JSON.stringify(selectedStages))}catch{}};
toggle=function(id,on){if(on){chosen.add(id);selectedStages[id]=6}else{chosen.delete(id);delete selectedStages[id]}render()};
const detailOriginal=detail;detail=function(id){detailOriginal(id);for(const h of $('detail').querySelectorAll('h2')){const s=[2,3,4,5].find(s=>h.textContent.startsWith(names[s]));if(s){const b=document.createElement('button');b.textContent='选用此阶段';b.style.marginLeft='12px';b.onclick=()=>{chosen.add(id);selectedStages[id]=s;$('detailPick').checked=true;render();b.textContent='已选此阶段'};h.append(b)}}};
$('export').onclick=()=>{const selected=records.filter(r=>chosen.has(r.id)).map(r=>({number:r.id,source_id:r.source_id,key:r.key,stage:selectedStages[r.id]||6,comparison:(selectedStages[r.id]||6)===6?'input_to_final':'stage_before_after'}));const url=URL.createObjectURL(new Blob([JSON.stringify({gallery:key,selected},null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download='landscape-selected.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};
render();
</script></body></html>
